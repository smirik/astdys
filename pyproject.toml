[project]
name = "astdys"
version = "1.0.2"
description = "AstDyS wrapper in python"
authors = [{ name = "Evgeny Smirnov", email = "smirik@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2.0,<3.0.0",
    "numpy>=2.0.1,<3.0.0",
    "pyarrow>=17.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.4",
    "black>=24.4.2,<25",
    "flake8>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["astdys"]

[tool.hatch.build.targets.sdist]
include = ["astdys", "README.md", "LICENSE"]

[tool.black]
line-length = 140
skip-string-normalization = true

[tool.pytest.ini_options]
addopts = "--ignore=tests/test_real.py"
pythonpath = ["."]
