name: astdys

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                # the oldest and the newest supported Python
                python-version: ["3.10", "3.13"]

        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v6

            - name: Install dependencies
              run: uv sync --locked --python ${{ matrix.python-version }}

            - name: Code Quality
              run: uv run black . --check

            - name: Lint
              run: uv run flake8 --count

            - name: Test with pytest
              run: uv run pytest -v tests

            - name: Build
              run: uv build
